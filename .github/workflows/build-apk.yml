name: Build APK & Release

# Trigger on pushes to main and on version tags (v1.0.0, v2.3.4-rc1, ...).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # required by softprops/action-gh-release to create/publish releases

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: camera_db

jobs:
  build-apk:
    name: Build APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two real NDK targets only:
        #   aarch64-linux-android    -> 64-bit (ARMv8a / arm64-v8a)
        #   armv7-linux-androideabi  -> 32-bit (ARMv7 / armeabi-v7a)
        # No armv9, no duplicated 64-bit entries.
        target: [aarch64-linux-android, armv7-linux-androideabi]

    steps:
      # 1. Checkout code -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Setup Java (JDK 17) --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 2b. Setup Android SDK (sets ANDROID_HOME + cmdline-tools) ---------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 2c. Install the specific platform required by Slint (Android 17 / API 37)
      - name: Install Android Platform
        run: |
          sdkmanager "platforms;android-37"
          echo "ANDROID_PLATFORM=android-37" >> $GITHUB_ENV

      # 3. Setup Android NDK r26b + SDK ----------------------------------------
      - name: Set up Android NDK r26b
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Export NDK environment
        run: |
          # ANDROID_HOME is already exported by android-actions/setup-android@v3;
          # do NOT override it here or the installed platforms become invisible.
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install Android SDK platform-tools / build-tools
        run: |
          # cmdline-tools are provided by android-actions/setup-android@v3 (sdkmanager on PATH).
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          # Fail fast if no platforms are present (Slint's i-slint-backend-android-activity check).
          ls "$ANDROID_HOME/platforms" | grep -q 'android-' || { echo "No Android platforms found" >&2; exit 1; }

      # 4. Setup Rust toolchain with the matrix target --------------------------
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target dir
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      # 5. Install cargo-ndk ------------------------------------------------------
      - name: Install CMake and Ninja (required by build.rs Kuzu pipeline)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          cmake --version
          llvm-nm --version 2>/dev/null ||             ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep llvm-nm

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # 6. Cross-compile the Rust cdylib for this matrix target --------------------
      - name: cargo ndk -t ${{ matrix.target }} -o app/src/main/jniLibs build --release
        run: |
          cargo ndk -t "${{ matrix.target }}" -o app/src/main/jniLibs build --release
          ls -Rl app/src/main/jniLibs

      # 7. Build the final APK (Gradle wrapper if present, else cargo-apk) ---------
      - name: Install cargo-apk (packaging fallback)
        run: cargo install cargo-apk --version 0.9.8 --locked

      - name: Grant execute permission for gradlew (if present)
        run: if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Assemble APK with Gradle (when wrapper exists)
        if: hashFiles('./gradlew') != ''
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew :app:assembleRelease

      - name: Build APK with cargo-apk (fallback when no gradle wrapper)
        if: hashFiles('./gradlew') == ''
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo apk build --release

      # 8. Resolve version + ABI suffix, rename assets to the exact convention -----
      - name: Resolve version and ABI suffix
        id: vars
        run: |
          # Tag push "v1.0.0" -> VERSION="1.0.0". Branch push -> short SHA.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

          # Exact asset naming per matrix target:
          #   aarch64-linux-android   -> arm64
          #   armv7-linux-androideabi -> armv7
          case "${{ matrix.target }}" in
            aarch64-linux-android)   echo "abi=arm64" >> "$GITHUB_OUTPUT" ;;
            armv7-linux-androideabi) echo "abi=armv7" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Stage renamed release assets
        id: stage
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ABI: ${{ steps.vars.outputs.abi }}
        run: |
          APK="$(find . -path ./target -prune -o -name '*.apk' -print | head -n1)"
          test -n "$APK" || { echo "No APK produced" >&2; exit 1; }
          echo "Located APK: $APK"

          mkdir -p release-assets
          cp "$APK" "release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.apk"

          # Corresponding zip: APK plus its jniLibs payload for this target.
          (cd app/src/main/jniLibs && zip -qr "$GITHUB_WORKSPACE/release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.zip" .) \
            || (cd "$(dirname "$APK")" && zip -j -q "$GITHUB_WORKSPACE/release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.zip" "$(basename "$APK")")

          ls -l release-assets
          echo "apk=release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.apk" >> "$GITHUB_OUTPUT"
          echo "zip=release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact (per target)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.apk }}
          path: ${{ steps.stage.outputs.apk }}
          if-no-files-found: error

      # 9. Generate SHA256 checksums for every staged release APK -------------------
      - name: Generate SHA256 Checksums
        working-directory: release-assets
        run: |
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Upload checksums artifact (per target)
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ steps.vars.outputs.abi }}
          path: release-assets/checksums.txt
          if-no-files-found: error

      # 10. Publish to GitHub Releases with the exact asset names -------------------
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Nightly ({0})', github.sha) }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          files: |
            ${{ steps.stage.outputs.apk }}
            ${{ steps.stage.outputs.zip }}
            release-assets/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
