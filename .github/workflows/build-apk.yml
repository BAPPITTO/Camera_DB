name: Build APK & Release

# Trigger on pushes to main and on version tags (v1.0.0, v2.3.4-rc1, ...).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # required by softprops/action-gh-release to create/publish releases

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: camera_db

jobs:
  build-apk:
    name: Build APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two real NDK targets only:
        #   aarch64-linux-android    -> 64-bit (ARMv8a / arm64-v8a)
        #   armv7-linux-androideabi  -> 32-bit (ARMv7 / armeabi-v7a)
        target: [aarch64-linux-android, armv7-linux-androideabi]

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125

    steps:
      # 1. Checkout code -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Setup Java (JDK 17) --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android environment using the pre-installed SDK --------------
      - name: Setup Android Environment
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "ndk;26.1.10909125"
          echo "ANDROID_PLATFORM=android-37" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          
          # Verify platforms are actually installed before proceeding
          if ! ls "$ANDROID_HOME/platforms" | grep -q 'android-'; then
            echo "ERROR: No Android platforms found after installation" >&2
            exit 1
          fi

      # 4. Setup Rust toolchain with the matrix target --------------------------
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      # 5. Install build dependencies -------------------------------------------
      - name: Install CMake and Ninja (required by build.rs Kuzu pipeline)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          cmake --version
          echo "NDK LLVM toolchain verified at: $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # 6. Cross-compile the Rust cdylib for this matrix target -----------------
      - name: Build Rust library with cargo-ndk
        run: |
          cargo ndk -t "${{ matrix.target }}" -o app/src/main/jniLibs build --release
          ls -Rl app/src/main/jniLibs || echo "Warning: jniLibs not populated, may be handled by gradle"

      # 7. Build the final APK --------------------------------------------------
      - name: Install cargo-apk (packaging fallback)
        run: cargo install cargo-apk --version 0.9.8 --locked

      - name: Grant execute permission for gradlew (if present)
        run: if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Assemble APK with Gradle (when wrapper exists)
        if: hashFiles('./gradlew') != ''
        run: ./gradlew :app:assembleRelease

      - name: Build APK with cargo-apk (fallback when no gradle wrapper)
        if: hashFiles('./gradlew') == ''
        run: cargo apk build --release

      # 8. Resolve version + ABI suffix, rename assets --------------------------
      - name: Resolve version and ABI suffix
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          
          case "${{ matrix.target }}" in
            aarch64-linux-android)   echo "abi=arm64" >> "$GITHUB_OUTPUT" ;;
            armv7-linux-androideabi) echo "abi=armv7" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Stage renamed release assets
        id: stage
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ABI: ${{ steps.vars.outputs.abi }}
        run: |
          # FIXED: Actually look in the target directory where the APK is built
          APK="$(find target -name '*.apk' -type f | head -n1)"
          
          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced in target/ directory" >&2
            find . -name '*.apk' -type f
            exit 1
          fi
          
          echo "Located APK: $APK"
          mkdir -p release-assets
          cp "$APK" "release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.apk"
          
          # Create a zip of the jniLibs for this target, if it exists
          if [ -d "app/src/main/jniLibs" ]; then
            (cd app/src/main/jniLibs && zip -qr "$GITHUB_WORKSPACE/release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.zip" .)
          else
            echo "Warning: jniLibs directory not found, zipping APK directory instead"
            (cd "$(dirname "$APK")" && zip -j -q "$GITHUB_WORKSPACE/release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.zip" "$(basename "$APK")")
          fi
          
          ls -l release-assets
          echo "apk=release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.apk" >> "$GITHUB_OUTPUT"
          echo "zip=release-assets/${PACKAGE_NAME}_${VERSION}_${ABI}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact (per target)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.apk }}
          path: ${{ steps.stage.outputs.apk }}
          if-no-files-found: error

      # 9. Generate SHA256 checksums --------------------------------------------
      - name: Generate SHA256 Checksums
        working-directory: release-assets
        run: |
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Upload checksums artifact (per target)
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ steps.vars.outputs.abi }}
          path: release-assets/checksums.txt
          if-no-files-found: error

      # 10. Publish to GitHub Releases ------------------------------------------
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Nightly ({0})', github.sha) }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          files: |
            ${{ steps.stage.outputs.apk }}
            ${{ steps.stage.outputs.zip }}
            release-assets/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
